[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mevo-companion"
version = "0.1.0"
description = "Desktop companion for Mevo cameras, with a local API for Stream Deck"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "zeroconf>=0.136",
    "pywebview>=5.3",
    "pydantic>=2.9",
    "httpx>=0.27",
    "curl_cffi>=0.13",
    "cyndilib>=0.1.1",
    "pillow>=10.0",
    "pystray>=0.19",
    "cyndilib>=0.1.1; sys_platform != 'linux'",
]

[project.scripts]
mevo-companion = "mevo_companion.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mevo_companion = ["web/*", "assets/*"]
